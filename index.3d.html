<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mini-Royale</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #050505; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px;
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #instructions {
            position: absolute; top: 20px; left: 50%;
            transform: translateX(-50%);
            color: white; font-weight: bold; text-shadow: 2px 2px 4px #000;
            text-align: center; font-size: 18px; pointer-events: none;
        }
        #hud {
            position: absolute; bottom: 20px; left: 20px;
            color: white; font-weight: bold; font-size: 20px;
            text-shadow: 2px 2px 4px #000; pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="instructions">CLICK SCREEN TO LOCK MOUSE & AIM<br>WASD to Move | Left Click to Shoot</div>
    <div id="hud">HEALTH: <span id="hp">100</span> | ENEMIES LEFT: <span id="bots">5</span></div>

<script>
// --- 1. SETUP ENGINE, SCENE, CAMERA, & RENDERER ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa0a0a0);
scene.fog = new THREE.FogExp2(0xa0a0a0, 0.015);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// --- 2. LIGHTING (Crucial for high fidelity) ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(40, 100, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 200;
const d = 100;
dirLight.shadow.camera.left = -d;
dirLight.shadow.camera.right = d;
dirLight.shadow.camera.top = d;
dirLight.shadow.camera.bottom = -d;
scene.add(dirLight);

// --- 3. CREATE THE WORLD (Environment) ---
// Ground grid with shadows
const floorGeo = new THREE.PlaneGeometry(1000, 1000);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x27ae60, roughness: 0.8 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Add some basic pillars/cover obstacles
const obstacles = [];
const obstacleGeo = new THREE.BoxGeometry(4, 10, 4);
const obstacleMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, roughness: 0.5 });
for(let i = 0; i < 40; i++) {
    const obstacle = new THREE.Mesh(obstacleGeo, obstacleMat);
    obstacle.position.set((Math.random() - 0.5) * 300, 5, (Math.random() - 0.5) * 300);
    obstacle.castShadow = true;
    obstacle.receiveShadow = true;
    scene.add(obstacle);
    obstacles.push(obstacle);
}

// --- 4. PLAYER & ENTITIES ---
// Player avatar representation
const playerGeometry = new THREE.CylinderGeometry(1, 1, 3, 16);
const playerMaterial = new THREE.MeshStandardMaterial({ color: 0x2980b9 });
const player = new THREE.Mesh(playerGeometry, playerMaterial);
player.position.set(0, 1.5, 0);
player.castShadow = true;
scene.add(player);

let playerData = { hp: 100, speed: 0.2 };

// Bots (Enemies)
const bots = [];
const botMaterial = new THREE.MeshStandardMaterial({ color: 0xc0392b });
for (let i = 0; i < 5; i++) {
    const bot = new THREE.Mesh(playerGeometry, botMaterial);
    bot.position.set((Math.random() - 0.5) * 150, 1.5, (Math.random() - 0.5) * 150);
    bot.castShadow = true;
    scene.add(bot);
    bots.push({ mesh: bot, hp: 100, lastShot: 0 });
}

let bullets = [];

// --- 5. CONTROLS & CAMERA LOGIC ---
let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
let yaw = 0, pitch = 0;

// Request pointer lock on click to lock the mouse cursor like a standard PC shooter
window.addEventListener('click', () => {
    document.body.requestPointerLock();
});

document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === document.body) {
        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;
        pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 4, pitch)); // Clamp look up/down
    }
});

window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyW') moveForward = true;
    if (e.code === 'KeyS') moveBackward = true;
    if (e.code === 'KeyA') moveLeft = true;
    if (e.code === 'KeyD') moveRight = true;
});

window.addEventListener('keyup', (e) => {
    if (e.code === 'KeyW') moveForward = false;
    if (e.code === 'KeyS') moveBackward = false;
    if (e.code === 'KeyA') moveLeft = false;
    if (e.code === 'KeyD') moveRight = false;
});

// Shooting action
window.addEventListener('mousedown', (e) => {
    if (document.pointerLockElement !== document.body || playerData.hp <= 0) return;
    
    // Project projectile vector directly forward from looking target vector
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);

    const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
    const bulletMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f });
    const bullet = new THREE.Mesh(bulletGeo, bulletMat);
    
    bullet.position.copy(player.position);
    bullet.position.y += 0.5; // Fire near chest height
    scene.add(bullet);

    bullets.push({ mesh: bullet, dir: dir, owner: 'player', aliveTime: 0 });
});

// --- 6. GAME LOOP ENGINE ENGINE ---
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    // 1. Calculate Movements
    if (playerData.hp > 0) {
        player.rotation.y = yaw;

        if (moveForward) player.translateZ(-playerData.speed);
        if (moveBackward) player.translateZ(playerData.speed);
        if (moveLeft) player.translateX(-playerData.speed);
        if (moveRight) player.translateX(playerData.speed);
    }

    // 2. Camera positioning (Over-the-shoulder third person mechanics)
    const relativeCameraOffset = new THREE.Vector3(0, 4, 10);
    const cameraOffset = relativeCameraOffset.applyMatrix4(player.matrixWorld);
    camera.position.x = cameraOffset.x;
    camera.position.y = cameraOffset.y + Math.sin(pitch) * 5;
    camera.position.z = cameraOffset.z;
    camera.lookAt(new THREE.Vector3(player.position.x, player.position.y + 1, player.position.z));

    // 3. Process project objects (Bullets)
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.mesh.position.addScaledVector(b.dir, 1.5);
        b.aliveTime++;

        // Hit testing against enemy targets
        if (b.owner === 'player') {
            for (let j = bots.length - 1; j >= 0; j--) {
                if (b.mesh.position.distanceTo(bots[j].mesh.position) < 2) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                    bots[j].hp -= 34;
                    
                    if (bots[j].hp <= 0) {
                        scene.remove(bots[j].mesh);
                        bots.splice(j, 1);
                        document.getElementById('bots').innerText = bots.length;
                    }
                    break;
                }
            }
        }

        // Clean old out-of-range bullets
        if (b.aliveTime > 100 && bullets[i]) {
            scene.remove(b.mesh);
            bullets.splice(i, 1);
        }
    }

    // 4. Enemy AI Actions
    bots.forEach(bot => {
        // Look towards the player vector
        bot.mesh.lookAt(player.position);
        
        // Shoot occasionally
        let dist = bot.mesh.position.distanceTo(player.position);
        if (dist < 60 && Math.random() < 0.02 && playerData.hp > 0) {
            const dir = new THREE.Vector3();
            dir.subVectors(player.position, bot.mesh.position).normalize();
            
            const bGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const bMat = new THREE.MeshBasicMaterial({ color: 0xe74c3c });
            const bMesh = new THREE.Mesh(bGeo, bMat);
            bMesh.position.copy(bot.mesh.position);
            scene.add(bMesh);
            bullets.push({ mesh: bMesh, dir: dir, owner: 'bot', aliveTime: 0 });
        }
    });

    renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
