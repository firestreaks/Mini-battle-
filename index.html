<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web-Slinger AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #0a0e1a;
    --navy-2: #10182b;
    --red: #e0262c;
    --red-dim: #7a1418;
    --blue: #1f5fae;
    --blue-bright: #4f9dff;
    --web: #e8ecf5;
    --gold: #ffc84a;
    --line: rgba(232,236,245,0.12);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(224,38,44,0.18), transparent 60%),
      radial-gradient(ellipse 900px 600px at 110% 10%, rgba(31,95,174,0.22), transparent 60%),
      var(--navy);
    color:var(--web);
    font-family:'Inter', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  /* faint web lines in the corners — signature element */
  .web-corner{
    position:fixed; width:520px; height:520px; pointer-events:none; opacity:0.16; z-index:0;
  }
  .web-corner.tl{ top:-160px; left:-160px; }
  .web-corner.br{ bottom:-200px; right:-200px; transform:rotate(180deg); }

  .shell{
    width:100%;
    max-width:640px;
    z-index:1;
    display:flex;
    flex-direction:column;
    height:100vh;
    padding:0 16px;
  }

  header{
    padding:22px 4px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid var(--line);
  }
  .mask{
    width:42px;height:42px;border-radius:50%;
    background: conic-gradient(from 200deg, var(--red), var(--red-dim), var(--blue), var(--blue-bright), var(--red));
    flex-shrink:0;
    position:relative;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.06), 0 0 22px rgba(224,38,44,0.35);
  }
  .mask::after{
    content:"";
    position:absolute; inset:9px;
    background:var(--navy);
    border-radius:50%;
    clip-path: polygon(50% 15%, 62% 40%, 88% 40%, 68% 58%, 76% 84%, 50% 68%, 24% 84%, 32% 58%, 12% 40%, 38% 40%);
  }
  header h1{
    font-family:'Bangers', cursive;
    letter-spacing:1.5px;
    font-size:26px;
    margin:0;
    color:var(--web);
    text-shadow: 2px 2px 0 var(--red-dim);
  }
  header p{
    margin:2px 0 0;
    font-size:12.5px;
    color:#9aa4bd;
  }
  .status-dot{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:7px;
    font-size:11.5px;
    color:#9aa4bd;
    font-family:'JetBrains Mono', monospace;
  }
  .status-dot span.led{
    width:8px;height:8px;border-radius:50%;
    background:#3ddc73;
    box-shadow:0 0 8px #3ddc73;
  }

  #thread{
    flex:1;
    overflow-y:auto;
    padding:20px 4px 10px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  #thread::-webkit-scrollbar{ width:6px; }
  #thread::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }

  .row{ display:flex; gap:10px; max-width:100%; }
  .row.user{ justify-content:flex-end; }
  .bubble{
    padding:11px 15px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.5;
    max-width:82%;
    white-space:pre-wrap;
  }
  .row.user .bubble{
    background:linear-gradient(135deg, var(--blue), #17407a);
    border-bottom-right-radius:3px;
  }
  .row.ai .bubble{
    background:var(--navy-2);
    border:1px solid var(--line);
    border-bottom-left-radius:3px;
  }
  .avatar{
    width:28px;height:28px;border-radius:50%;flex-shrink:0;margin-top:2px;
    background: conic-gradient(from 200deg, var(--red), var(--red-dim), var(--blue), var(--blue-bright), var(--red));
  }
  .ai-label{
    font-family:'Bangers', cursive;
    font-size:12px;
    letter-spacing:1px;
    color:var(--gold);
    margin-bottom:4px;
    display:block;
  }
  .typing{
    display:flex; gap:4px; padding:4px 2px;
  }
  .typing i{
    width:6px;height:6px;border-radius:50%;background:var(--gold);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing i:nth-child(2){ animation-delay:0.15s; }
  .typing i:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform:translateY(0); opacity:0.5;} 30%{ transform:translateY(-5px); opacity:1;} }

  form{
    display:flex;
    gap:8px;
    padding:14px 4px 20px;
    border-top:1px solid var(--line);
    align-items:flex-end;
  }
  #speakToggle{
    display:flex; align-items:center; gap:6px;
    font-size:11.5px; color:#9aa4bd;
    padding:0 2px 8px;
    cursor:pointer;
    user-select:none;
  }
  #speakToggle input{ accent-color: var(--red); }

  textarea{
    flex:1;
    resize:none;
    background:var(--navy-2);
    border:1px solid var(--line);
    color:var(--web);
    border-radius:12px;
    padding:12px 14px;
    font-size:14.5px;
    font-family:'Inter', sans-serif;
    max-height:120px;
    outline:none;
  }
  textarea:focus{ border-color: var(--blue-bright); }

  button{
    border:none;
    cursor:pointer;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  #micBtn{
    width:46px;height:46px;
    background:var(--navy-2);
    border:1px solid var(--line);
    color:var(--web);
  }
  #micBtn.listening{
    background: radial-gradient(circle, var(--red), var(--red-dim));
    box-shadow: 0 0 0 6px rgba(224,38,44,0.18);
    animation: pulse 1.3s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(224,38,44,0.35); }
    70%{ box-shadow:0 0 0 12px rgba(224,38,44,0); }
    100%{ box-shadow:0 0 0 0 rgba(224,38,44,0); }
  }
  #sendBtn{
    width:46px;height:46px;
    background:linear-gradient(135deg, var(--red), var(--red-dim));
    color:white;
  }
  #sendBtn:disabled{ opacity:0.45; cursor:default; }

  .hint{
    text-align:center;
    font-size:11px;
    color:#5c6580;
    padding-bottom:6px;
  }
</style>
</head>
<body>

<svg class="web-corner tl" viewBox="0 0 200 200"><g stroke="white" stroke-width="1" fill="none">
  <path d="M0,0 L200,200 M0,40 L160,200 M0,80 L120,200 M0,120 L80,200 M0,160 L40,200 M40,0 L200,160 M80,0 L200,120 M120,0 L200,80 M160,0 L200,40"/>
  <path d="M0,0 Q100,10 200,0 M0,0 Q10,100 0,200 M20,20 Q100,40 180,20 M20,20 Q40,100 20,180 M50,50 Q100,65 150,50 M50,50 Q65,100 50,150 M85,85 Q100,90 115,85 M85,85 Q90,100 85,115"/>
</g></svg>
<svg class="web-corner br" viewBox="0 0 200 200"><g stroke="white" stroke-width="1" fill="none">
  <path d="M0,0 L200,200 M0,40 L160,200 M0,80 L120,200 M0,120 L80,200 M0,160 L40,200 M40,0 L200,160 M80,0 L200,120 M120,0 L200,80 M160,0 L200,40"/>
  <path d="M0,0 Q100,10 200,0 M0,0 Q10,100 0,200 M20,20 Q100,40 180,20 M20,20 Q40,100 20,180 M50,50 Q100,65 150,50 M50,50 Q65,100 50,150 M85,85 Q100,90 115,85 M85,85 Q90,100 85,115"/>
</g></svg>

<div class="shell">
  <header>
    <div class="mask"></div>
    <div>
      <h1>WEB-SLINGER AI</h1>
      <p>Wisecracks &amp; wall-crawling wisdom, genius-level math &amp; science brain</p>
    </div>
    <div class="status-dot"><span class="led"></span>ONLINE</div>
  </header>

  <div id="thread"></div>

  <label id="speakToggle">
    <input type="checkbox" id="speakCheck" checked> Read replies aloud
  </label>

  <form id="form">
    <button type="button" id="micBtn" title="Talk to me">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="Ask me anything, pal — math, physics, or just say hi..."></textarea>
    <button type="submit" id="sendBtn">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </form>
  <div class="hint" id="hint">Tap the mic and talk, or just type below.</div>
</div>

<script>
const thread = document.getElementById('thread');
const form = document.getElementById('form');
const input = document.getElementById('input');
const micBtn = document.getElementById('micBtn');
const sendBtn = document.getElementById('sendBtn');
const speakCheck = document.getElementById('speakCheck');
const hint = document.getElementById('hint');

const SYSTEM_PROMPT = `You are "Web-Slinger AI" — a chatbot with the personality of a witty, upbeat, wisecracking friendly-neighborhood superhero who swings around a big city fighting crime in his off hours. You crack quick puns and light jokes, call the user "buddy," "pal," or "champ," stay humble and warm even though you're secretly a certified genius, and you never take yourself too seriously. Underneath the jokes, you have a genius-level, Einstein-caliber command of mathematics, physics, and science — you solve equations precisely and correctly, show step-by-step work when it helps understanding, and explain complex concepts with vivid, simple analogies (webs, cities, science-lab metaphors are fair game). Keep everyday replies short and punchy like natural conversation. For math/science questions, prioritize being rigorous and correct — get the numbers right — while keeping a friendly, encouraging voice. Never break character by claiming to be a specific copyrighted character by name; just embody the personality: quippy, kind, brilliant, a little humble-bragging about the science stuff.`;

let history = [];

function addBubble(role, text){
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'user' : 'ai');
  let inner = '';
  if(role !== 'user'){
    inner += '<div class="avatar"></div>';
  }
  const bubbleWrap = document.createElement('div');
  bubbleWrap.style.maxWidth = '82%';
  const label = role !== 'user' ? '<span class="ai-label">WEB-SLINGER</span>' : '';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = label + escapeHtml(text).replace(/\n/g,'<br>');
  row.innerHTML = inner;
  row.appendChild(bubble);
  thread.appendChild(row);
  thread.scrollTop = thread.scrollHeight;
  return bubble;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function addTypingBubble(){
  const row = document.createElement('div');
  row.className = 'row ai';
  row.innerHTML = '<div class="avatar"></div>';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<span class="ai-label">WEB-SLINGER</span><div class="typing"><i></i><i></i><i></i></div>';
  row.appendChild(bubble);
  thread.appendChild(row);
  thread.scrollTop = thread.scrollHeight;
  return { row, bubble };
}

function speak(text){
  if(!speakCheck.checked) return;
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/[*_`#]/g, '');
  const utter = new SpeechSynthesisUtterance(clean);
  utter.rate = 1.03;
  utter.pitch = 1.05;
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => /male|david|daniel|google us english/i.test(v.name)) || voices[0];
  if(preferred) utter.voice = preferred;
  window.speechSynthesis.speak(utter);
}

async function sendMessage(text){
  if(!text.trim()) return;
  addBubble('user', text);
  history.push({ role: 'user', content: text });
  input.value = '';
  autosize();
  sendBtn.disabled = true;

  const { bubble } = addTypingBubble();

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: history
      })
    });
    const data = await response.json();
    const textOut = (data.content || [])
      .map(block => block.type === 'text' ? block.text : '')
      .filter(Boolean)
      .join('\n') || "Whoa, my web-fluid's jammed — try that again, pal.";

    bubble.innerHTML = '<span class="ai-label">WEB-SLINGER</span>' + escapeHtml(textOut).replace(/\n/g,'<br>');
    history.push({ role: 'assistant', content: textOut });
    speak(textOut);
  }catch(err){
    bubble.innerHTML = '<span class="ai-label">WEB-SLINGER</span>Ugh, seems like my spider-sense (and my wifi) glitched. Give it another shot, buddy.';
  } finally {
    sendBtn.disabled = false;
    thread.scrollTop = thread.scrollHeight;
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  sendMessage(input.value);
});

input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage(input.value);
  }
});

function autosize(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
}
input.addEventListener('input', autosize);

/* ---- Speech recognition (voice input) ---- */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
let listening = false;
const DEFAULT_HINT = "Tap the mic and talk, or just type below.";

function setHint(msg, isError){
  hint.textContent = msg;
  hint.style.color = isError ? '#ff8a8a' : '#5c6580';
}

async function ensureMicPermission(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    throw new Error('no-media-devices');
  }
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  stream.getTracks().forEach(t => t.stop());
}

if(SpeechRecognition){
  recognizer = new SpeechRecognition();
  recognizer.continuous = false;
  recognizer.interimResults = true;
  recognizer.lang = 'en-US';

  recognizer.onstart = () => {
    listening = true;
    micBtn.classList.add('listening');
    setHint("Listening... talk to me, buddy.");
  };
  recognizer.onresult = (event) => {
    let transcript = '';
    for(let i = 0; i < event.results.length; i++){
      transcript += event.results[i][0].transcript;
    }
    input.value = transcript;
    autosize();
  };
  recognizer.onerror = (event) => {
    listening = false;
    micBtn.classList.remove('listening');
    if(event.error === 'not-allowed' || event.error === 'service-not-allowed'){
      setHint("Mic access is blocked. If you're viewing this in a preview panel, open the file directly in a browser tab and allow microphone access when prompted.", true);
    } else if(event.error === 'no-speech'){
      setHint("Didn't catch anything — tap the mic and try again.", true);
    } else if(event.error === 'audio-capture'){
      setHint("No microphone found on this device.", true);
    } else {
      setHint("Voice hiccup (" + event.error + ") — try again, or just type.", true);
    }
  };
  recognizer.onend = () => {
    listening = false;
    micBtn.classList.remove('listening');
    if(hint.style.color !== 'rgb(255, 138, 138)') setHint(DEFAULT_HINT);
    if(input.value.trim()) sendMessage(input.value);
  };

  micBtn.addEventListener('click', async () => {
    if(listening){
      recognizer.stop();
      return;
    }
    setHint("Requesting microphone access...");
    try{
      await ensureMicPermission();
      recognizer.start();
    }catch(e){
      if(e.name === 'NotAllowedError' || e.message === 'no-media-devices'){
        setHint("Mic access denied or unavailable here. Download this file and open it directly in Chrome (desktop or Android) — the preview panel often blocks microphone access.", true);
      } else if(e.name === 'NotFoundError'){
        setHint("No microphone found on this device.", true);
      } else {
        setHint("Couldn't access the mic — try opening this page in its own browser tab.", true);
      }
    }
  });
} else {
  micBtn.disabled = true;
  micBtn.style.opacity = 0.35;
  setHint("Voice input isn't supported in this browser — Chrome on desktop/Android works best. Typing still works great!", true);
}

/* Warm greeting */
addBubble('ai', "Hey there, buddy! Your friendly neighborhood web-slinger is online — genius-level math and science brain included. Ask me to crunch an equation, explain black holes, or just say what's up. 🕸️");
</script>
</body>
</html>
