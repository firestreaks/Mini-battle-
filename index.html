function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}

const N=160,mkP=b=>({x:Math.random()*cv.width,y:b?cv.height+20:cv.height-Math.random()*cv.height*.85,vx:(Math.random()-.5)*1.1,vy:-(Math.random()*3+1.4),life:Math.random()*.65+.35,ml:1,sz:Math.random()*16+5,hue:Math.random()<0.5?0:1});
const ps=Array.from({length:N},()=>mkP(false));
function tick(){
ctx.clearRect(0,0,cv.width,cv.height);
const bg=ctx.createLinearGradient(0,0,0,cv.height);
bg.addColorStop(0,'#020204');bg.addColorStop(.6,'#050510');bg.addColorStop(1,'#0a1024');
ctx.fillStyle=bg;ctx.fillRect(0,0,cv.width,cv.height);
const eg=ctx.createRadialGradient(cv.width/2,cv.height,0,cv.width/2,cv.height,cv.width*.65);
eg.addColorStop(0,'rgba(31,95,174,0.16)');eg.addColorStop(.45,'rgba(224,38,44,0.07)');eg.addColorStop(1,'rgba(0,0,0,0)');
ctx.fillStyle=eg;ctx.fillRect(0,0,cv.width,cv.height);
ctx.globalCompositeOperation='screen';const now=Date.now()*.001;
ps.forEach(p=>{
p.x+=p.vx+Math.sin(now+p.y*.009)*.5;p.y+=p.vy;p.vy-=.03;p.life-=.011;p.sz*=.994;
if(p.life<=0||p.y<-80)Object.assign(p,mkP(true));
const a=Math.max(0,p.life/p.ml);
const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.sz);
if(p.hue){
  g.addColorStop(0,`rgba(120,${Math.floor(a*160+60)},255,1)`);
  g.addColorStop(.4,`rgba(40,${Math.floor(a*100)},220,0.6)`);
  g.addColorStop(1,'rgba(0,10,60,0)');
}else{
  g.addColorStop(0,`rgba(255,${Math.floor(a*90+30)},40,1)`);
  g.addColorStop(.4,`rgba(200,${Math.floor(a*40)},20,0.6)`);
  g.addColorStop(1,'rgba(60,0,0,0)');
}
ctx.globalAlpha=a*.75;ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill();
});
ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;requestAnimationFrame(tick);
}tick();

const QUIPS=["Web-slinger fact incoming, buddy —","Here's the scoop, pal:","Straight from the genius lab:","Okay, science brain activated —","Swinging in with the answer:","Alright, champ, here's the deal:"];

function spideyify(ans){
  const isShort = ans.length<=42 && !ans.includes('\n');
  if(!isShort && Math.random()<0.35){
    const quip = QUIPS[Math.floor(Math.random()*QUIPS.length)];
    return quip+"\n"+ans;
  }
  return ans;
}

function resolveAnswer(e){
  return Array.isArray(e.a) ? e.a[Math.floor(Math.random()*e.a.length)] : e.a;
}

function niceNum(r){
  if (Number.isInteger(r)) return String(r);
  const rounded = Math.round(r * 1e6) / 1e6;
  return String(rounded);
}

function tryMath(q){
  // "X percent of Y" / "X% of Y"
  let m = q.match(/([\d.]+)\s*(%|percent)\s*of\s*([\d.]+)/);
  if(m){
    const a=parseFloat(m[1]), b=parseFloat(m[3]);
    return `${a}% of ${b} = ${niceNum((a/100)*b)}`;
  }

  // "square root of X" / "sqrt X" / "√X" — works for ANY number, not just a fixed list
  m = q.match(/(?:square root of|sqrt|√)\s*([\d.]+)/);
  if(m){
    const n = parseFloat(m[1]);
    const r = Math.sqrt(n);
    return `√${niceNum(n)} = ${Number.isInteger(r) ? r : r.toFixed(6)+'...'}`;
  }

  // "cube root of X"
  m = q.match(/cube root of\s*([\d.]+)/);
  if(m){
    const n = parseFloat(m[1]);
    const r = Math.cbrt(n);
    return `∛${niceNum(n)} = ${Number.isInteger(r) ? r : r.toFixed(6)+'...'}`;
  }

  // "X squared" / "X cubed"
  m = q.match(/([\d.]+)\s*squared/);
  if(m){ const n=parseFloat(m[1]); return `${niceNum(n)}² = ${niceNum(n*n)}`; }
  m = q.match(/([\d.]+)\s*cubed/);
  if(m){ const n=parseFloat(m[1]); return `${niceNum(n)}³ = ${niceNum(n*n*n)}`; }

  // Word-based arithmetic: "45 divided by 9", "12 times 8", "20 plus 5", "to the power of"
  let s = ' ' + q + ' ';
  s = s.replace(/\bto the power of\b/g, '^');
  s = s.replace(/\bdivided by\b|\bdivide\b/g, '/');
  s = s.replace(/\btimes\b|\bmultiplied by\b|\bmultiply\b/g, '*');
  s = s.replace(/\bplus\b|\badded to\b/g, '+');
  s = s.replace(/\bminus\b|\bsubtracted by\b/g, '-');
  s = s.replace(/\bwhat is\b|\bcalculate\b|\bsolve\b|\bcompute\b|\bequals\b|\bequal to\b/g, '');
  s = s.replace(/\^/g, '**');
  s = s.trim();
  if (/^[\d\s\+\-\*\/\(\)\.x%]+$/.test(s) && /\d/.test(s) && s.length > 0) {
    try {
      const r = Function('"use strict";return(' + s.replace(/x/gi,'*') + ')')();
      if (!isNaN(r) && isFinite(r)) return s.trim() + ' = ' + niceNum(r);
    } catch(e) {}
  }
  return null;
}

function getAnswer(raw) {
  const q = raw.toLowerCase().trim().replace(/['’]/g,'').replace(/[?!.,;]/g,'');
  if (!q) return "Ask me something, pal!";

  // Math is computed live, ALWAYS, before touching the stored knowledge base —
  // this guarantees "45 divided by 9" or "square root of 200" get the exact
  // right number instead of accidentally matching a similar-looking stored fact.
  const mathAnswer = tryMath(q);
  if (mathAnswer) return mathAnswer;

  for (const e of QA) {
    for (const k of e.q) {
      if (q === k) return spideyify(resolveAnswer(e));
      if (k.length >= 4 && q.includes(k)) return spideyify(resolveAnswer(e));
      if (q.length >= 4 && k.includes(q)) return spideyify(resolveAnswer(e));
    }
  }

  const words = q.split(/\s+/).filter(w => w.length > 2);
  let best = 0, ansEntry = null;
  for (const e of QA) {
    for (const k of e.q) {
      const kw = k.split(/\s+/);
      let score = 0;
      for (const w of words) if (kw.includes(w)) score += w.length > 4 ? 2 : 1;
      if (score > best) { best = score; ansEntry = e; }
    }
  }
  if (best >= 3) return spideyify(resolveAnswer(ansEntry));

  if (q.includes('capital of') || q.includes('capital city')) return "I know most world capitals, buddy! Try: 'What is the capital of [country]?'";
  if (q.includes('how to') || q.includes('how do i') || q.includes('how can i')) return "Good how-to question! Be a bit more specific, pal. Try: 'How do I [specific thing]?'";
  if (q.includes('who invented') || q.includes('who created')) return "I know plenty of inventors! Try: 'Who invented [thing]?'";
  if (q.includes('when did') || q.includes('what year')) return "Try: 'When did [event] happen?' I know my history!";
  if (q.includes('what is') || q.includes('what are')) return "Try rephrasing with more specific terms, champ — I cover science, math, history, coding, health, geography, philosophy, sport, music, culture and more.";
  if (q.includes('who is') || q.includes('who was')) return "I know a lot of famous folks! Be more specific — name who you want to know about.";
  if (q.includes('why ')) return "Great 'why' question! Give me a bit more context, pal.";
  if (q.includes('where ')) return "Location question? Try: 'What is the capital of [country]?'";
  return "Hmm, don't have that one exactly, buddy — try rephrasing! I cover science, math, history, geography, coding, health, food, animals, sports, music, movies, philosophy, language, economics and much more.";
}

const SUGS = [
  "What is gravity?","Speed of light?","What is DNA?","What is AI?",
  "Capital of Japan?","Who was Einstein?","How many planets?","What is 12*12?",
  "How do I start coding?","What is the Big Bang?","Who painted Mona Lisa?",
  "What is the Pythagorean theorem?","What is Fibonacci?","What is a black hole?",
  "Who is Shakespeare?","What is stoicism?","What is CRISPR?","Capital of Australia?",
  "What is compound interest?"
];

const msgs = document.getElementById('msgs');
const inp  = document.getElementById('ui');
const btn  = document.getElementById('sb');
const sc   = document.getElementById('sc');
const qc   = document.getElementById('qc');
const mb   = document.getElementById('mb');
const speakCheck = document.getElementById('speakCheck');
const wakeCheck  = document.getElementById('wakeCheck');
const ht = document.getElementById('ht');

qc.textContent = QA.length + ' topics';

SUGS.forEach(s => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = s;
  b.addEventListener('click', () => { unlockAudio(); send(s); });
  sc.appendChild(b);
});

function fmt(ms) { return ms < 1000 ? ms + 'ms' : (ms/1000).toFixed(2) + 's'; }

function addMsg(role, text, timer) {
  const row = document.createElement('div');
  row.className = 'mr ' + role;
  if (role === 'a') {
    const av = document.createElement('div');
    av.className = 'av'; av.textContent = '🕷️';
    row.appendChild(av);
  }
  const wrap = document.createElement('div');
  wrap.className = 'mw';
  if (role === 'a') {
    const meta = document.createElement('div');
    meta.className = 'mm';
    const nm = document.createElement('span');
    nm.className = 'mn'; nm.textContent = 'WEB-SLINGER';
    meta.appendChild(nm);
    if (timer > 0) {
      const tb = document.createElement('span');
      tb.className = 'tb'; tb.textContent = '⚡ ' + fmt(timer);
      meta.appendChild(tb);
    }
    wrap.appendChild(meta);
  }
  const bub = document.createElement('div');
  bub.className = 'b ' + role;
  bub.textContent = text;
  wrap.appendChild(bub);
  row.appendChild(wrap);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function send(text) {
  const q = (text !== undefined ? text : inp.value).trim();
  if (!q) return;
  inp.value = ''; inp.style.height = 'auto';
  btn.disabled = true;
  addMsg('u', q, 0);
  const t0 = Date.now();
  setTimeout(() => {
    const answer = getAnswer(q);
    addMsg('a', answer, Date.now() - t0);
    speak(answer);
  }, 40 + Math.random() * 100);
}

inp.addEventListener('input', () => {
  btn.disabled = !inp.value.trim();
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, 100) + 'px';
});
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); unlockAudio(); send(); }
});
btn.addEventListener('click', () => { unlockAudio(); send(); });

let cachedVoices = [];
function refreshVoices(){ cachedVoices = window.speechSynthesis.getVoices(); }
if('speechSynthesis' in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}
let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked || !('speechSynthesis' in window)) return;
  try{
    const primer = new SpeechSynthesisUtterance(' ');
    primer.volume = 0;
    window.speechSynthesis.speak(primer);
    audioUnlocked = true;
  }catch(e){}
}
function speak(text){
  if(!speakCheck.checked) return;
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/[*_`#]/g, '');
  const utter = new SpeechSynthesisUtterance(clean);
  utter.rate = 1.04;
  utter.pitch = 1.05;
  const preferred = cachedVoices.find(v => /male|david|daniel|google us english/i.test(v.name)) || cachedVoices[0];
  if(preferred) utter.voice = preferred;
  utter.onerror = () => { setHint("Couldn't play voice audio here — text reply still works.", true); };
  window.speechSynthesis.speak(utter);
}

const DEFAULT_HINT = 'ENTER TO SEND · TAP MIC OR SAY "SPIDERMAN AI" TO TALK';
function setHint(msg, isError){
  ht.textContent = msg;
  ht.classList.toggle('err', !!isError);
}

async function ensureMicPermission(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no-media-devices');
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  stream.getTracks().forEach(t => t.stop());
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null, listening = false;

if(SpeechRecognition){
  recognizer = new SpeechRecognition();
  recognizer.continuous = false;
  recognizer.interimResults = true;
  recognizer.lang = 'en-US';

  recognizer.onstart = () => { listening = true; mb.classList.add('listening'); setHint('Listening... talk to me, buddy.'); };
  recognizer.onresult = (event) => {
    let transcript = '';
    for(let i=0;i<event.results.length;i++) transcript += event.results[i][0].transcript;
    inp.value = transcript;
    btn.disabled = !inp.value.trim();
  };
  recognizer.onerror = (event) => {
    listening = false; mb.classList.remove('listening');
    if(event.error === 'not-allowed' || event.error === 'service-not-allowed'){
      setHint("Mic access blocked. Open this file in a real browser tab and allow the mic.", true);
    } else if(event.error === 'no-speech'){
      setHint("Didn't catch anything — tap the mic and try again.", true);
    } else {
      setHint("Voice hiccup (" + event.error + ") — try again, or just type.", true);
    }
  };
  recognizer.onend = () => {
    listening = false; mb.classList.remove('listening');
    if(!ht.classList.contains('err')) setHint(DEFAULT_HINT);
    if(inp.value.trim()){ unlockAudio(); send(inp.value); }
  };

  mb.addEventListener('click', async () => {
    unlockAudio();
    if(listening){ recognizer.stop(); return; }
    setHint("Requesting microphone access...");
    try{
      await ensureMicPermission();
      recognizer.start();
    }catch(e){
      setHint("Mic access denied or unavailable here. Try opening this file directly in Chrome.", true);
    }
  });
} else {
  mb.disabled = true; mb.style.opacity = 0.35;
  setHint("Voice input isn't supported in this browser. Typing still works great!", true);
}

let wakeRecognizer = null, wakeActive = false;

// Speech recognition very often mishears "AI" (spoken as two letters) as "I",
// "eye", or drops it — so we only require hearing "spiderman"/"spider man"
// itself, then strip whatever filler word follows it ("ai"/"i"/"eye"/etc.)
// before treating the rest as the actual question. Much more forgiving.
function extractCommand(transcript){
  const triggerRegex = /spider[\s-]?man/gi;
  let lastMatch = null, m;
  while((m = triggerRegex.exec(transcript)) !== null){ lastMatch = m; }
  if(!lastMatch) return null;
  let rest = transcript.slice(lastMatch.index + lastMatch[0].length);
  rest = rest.replace(/^[\s,:.\-]*\b(a\.?\s?i\.?|ai|eye|i)\b[\s,:.\-]*/i, '');
  return rest.trim().replace(/^[,:.\-]+/, '').trim();
}

function startWakeListening(){
  if(!SpeechRecognition){ setHint("Voice input isn't supported here.", true); wakeCheck.checked=false; return; }
  wakeActive = true;
  wakeRecognizer = new SpeechRecognition();
  wakeRecognizer.continuous = true;
  wakeRecognizer.interimResults = false;
  wakeRecognizer.lang = 'en-US';

  wakeRecognizer.onresult = (event) => {
    const result = event.results[event.results.length-1];
    if(!result.isFinal) return;
    const command = extractCommand(result[0].transcript);
    if(command===null) return;
    unlockAudio();
    if(command.length>0) send(command);
    else setHint('Heard "Spiderman AI" — go ahead, ask your question, pal.');
  };
  wakeRecognizer.onerror = (event) => {
    if(event.error==='not-allowed' || event.error==='service-not-allowed'){
      setHint("Mic access blocked — can't listen for the wake word here.", true);
      wakeActive=false; wakeCheck.checked=false;
    }
  };
  wakeRecognizer.onend = () => { if(wakeActive){ try{ wakeRecognizer.start(); }catch(e){} } };

  try{
    wakeRecognizer.start();
    setHint('Listening for "Spiderman AI"...');
    mb.disabled = true; mb.style.opacity = 0.35;
  }catch(e){
    setHint("Couldn't start wake-word listening.", true);
    wakeActive=false; wakeCheck.checked=false;
  }
}

function stopWakeListening(){
  wakeActive = false;
  if(wakeRecognizer){ wakeRecognizer.onend=null; try{ wakeRecognizer.stop(); }catch(e){} wakeRecognizer=null; }
  mb.disabled = false; mb.style.opacity = 1;
  setHint(DEFAULT_HINT);
}

wakeCheck.addEventListener('change', async () => {
  if(wakeCheck.checked){
    unlockAudio();
    setHint("Requesting microphone access...");
    try{ await ensureMicPermission(); startWakeListening(); }
    catch(e){ wakeCheck.checked=false; setHint("Mic access denied or unavailable — can't enable wake-word mode here.", true); }
  } else {
    stopWakeListening();
  }
});

addMsg('a', "Hey, buddy! Web-Slinger AI here — " + QA.length + "+ topics covering math, science, history, geography, coding, health, and more, all running right on this device. No network needed, so no more \"can't reach my brain\" errors. Type, tap the mic, or say \"Spiderman AI\" followed by your question. Let's swing into it!", 0);
</script>
